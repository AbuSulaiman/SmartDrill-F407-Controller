<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect width="100%" height="100%" fill="white"/><text x="35" y="40" fill="#23384d" font-family="Arial,sans-serif" font-size="20" font-weight="700">SMARTDRILL / STM32G431CBU6</text><text x="35" y="65" fill="#23384d" font-family="Arial,sans-serif" font-size="16" font-weight="700">2. Isolated zero-cross detector and gate driver</text><text x="35" y="88" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Replaces the original 6N137 + bridge + HEF40106 circuit. Net names connect sheets; do not join domains.</text><line x1="35" y1="104" x2="1085" y2="104" stroke="#23384d" stroke-width="1.3"/><line x1="550" y1="115" x2="550" y2="700" stroke="#b42318" stroke-width="1.3" stroke-dasharray="5 4"/><text x="55" y="139" fill="#b42318" font-family="Arial,sans-serif" font-size="13" font-weight="700">MAINS SIDE</text><text x="600" y="139" fill="#23384d" font-family="Arial,sans-serif" font-size="13" font-weight="700">ISOLATED LOW-VOLTAGE SIDE</text><text x="50" y="208" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">L_SW</text><line x1="85" y1="204" x2="100" y2="204" stroke="#23384d" stroke-width="1.3"/><line x1="100" y1="204" x2="112" y2="204" stroke="#23384d" stroke-width="1.3"/><rect x="112" y="196" width="116" height="16" fill="none" stroke="#23384d" stroke-width="1.3"/><line x1="228" y1="204" x2="240" y2="204" stroke="#23384d" stroke-width="1.3"/><text x="105" y="187" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R5 15k / 2 W</text><line x1="240" y1="204" x2="315" y2="204" stroke="#23384d" stroke-width="1.3"/><rect x="315" y="175" width="150" height="115" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="325" y="198" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">U1 H11AA1</text><text x="325" y="241" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Antiparallel LEDs</text><text x="320" y="218" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">1 input</text><text x="320" y="268" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">2 input</text><line x1="315" y1="265" x2="240" y2="265" stroke="#23384d" stroke-width="1.3"/><line x1="100" y1="265" x2="112" y2="265" stroke="#23384d" stroke-width="1.3"/><rect x="112" y="257" width="116" height="16" fill="none" stroke="#23384d" stroke-width="1.3"/><line x1="228" y1="265" x2="240" y2="265" stroke="#23384d" stroke-width="1.3"/><text x="105" y="248" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R6 15k / 2 W</text><line x1="85" y1="265" x2="100" y2="265" stroke="#23384d" stroke-width="1.3"/><text x="50" y="269" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">N_SW</text><text x="55" y="323" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R5/R6: flameproof, mains voltage-rated.</text><text x="55" y="345" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Each dissipates ~0.88 W at 230 V, ~1.07 W at 253 V.</text><rect x="625" y="175" width="155" height="115" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="635" y="198" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">U1 output</text><text x="635" y="218" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">5 collector / 4 emitter</text><text x="633" y="267" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">6 base: leave open</text><text x="633" y="284" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">3: NC</text><line x1="780" y1="204" x2="905" y2="204" stroke="#23384d" stroke-width="1.3"/><circle cx="820" cy="204" r="2.5" fill="#23384d"/><text x="840" y="193" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">ZERO_CROSS</text><line x1="905" y1="204" x2="1020" y2="204" stroke="#23384d" stroke-width="1.3"/><text x="955" y="229" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">PA0 / EXTI0</text><line x1="820" y1="204" x2="820" y2="150" stroke="#23384d" stroke-width="1.3"/><text x="835" y="150" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">3V3</text><rect x="812" y="153" width="16" height="36" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="840" y="176" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">R7 10k</text><line x1="780" y1="265" x2="850" y2="265" stroke="#23384d" stroke-width="1.3"/><text x="856" y="269" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">GND_LV</text><text x="600" y="325" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">ZC is HIGH in a window around each voltage zero.</text><text x="600" y="347" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Capture BOTH edges; the pulse center estimates zero.</text><text x="600" y="369" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Single-edge timing requires measured offset compensation.</text><line x1="35" y1="395" x2="1085" y2="395" stroke="#23384d" stroke-width="1.3"/><text x="600" y="431" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">+5V_ISO</text><line x1="650" y1="440" x2="650" y2="473" stroke="#23384d" stroke-width="1.3"/><line x1="650" y1="473" x2="662" y2="473" stroke="#23384d" stroke-width="1.3"/><rect x="662" y="465" width="116" height="16" fill="none" stroke="#23384d" stroke-width="1.3"/><line x1="778" y1="473" x2="790" y2="473" stroke="#23384d" stroke-width="1.3"/><text x="655" y="456" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R8 180R / 0.5 W</text><line x1="790" y1="473" x2="815" y2="473" stroke="#23384d" stroke-width="1.3"/><rect x="815" y="447" width="180" height="65" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="825" y="470" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">U2 LED side</text><text x="825" y="490" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">1 anode / 2 cathode</text><text x="800" y="465" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">1</text><text x="800" y="508" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">2</text><line x1="815" y1="495" x2="770" y2="495" stroke="#23384d" stroke-width="1.3"/><line x1="770" y1="495" x2="770" y2="570" stroke="#23384d" stroke-width="1.3"/><rect x="720" y="570" width="110" height="65" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="730" y="593" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Q2 2N3904</text><text x="730" y="613" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Use B/C/E names</text><text x="779" y="565" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">C</text><text x="701" y="601" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">B</text><text x="779" y="651" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">E</text><line x1="770" y1="635" x2="770" y2="685" stroke="#23384d" stroke-width="1.3"/><text x="780" y="688" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">GND_LV</text><text x="580" y="549" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">PA5 / FIRE</text><line x1="580" y1="555" x2="580" y2="595" stroke="#23384d" stroke-width="1.3"/><line x1="580" y1="595" x2="592" y2="595" stroke="#23384d" stroke-width="1.3"/><rect x="592" y="587" width="86" height="16" fill="none" stroke="#23384d" stroke-width="1.3"/><line x1="678" y1="595" x2="690" y2="595" stroke="#23384d" stroke-width="1.3"/><text x="585" y="578" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R9 1k</text><line x1="690" y1="595" x2="720" y2="595" stroke="#23384d" stroke-width="1.3"/><circle cx="690" cy="595" r="2.5" fill="#23384d"/><line x1="690" y1="595" x2="690" y2="650" stroke="#23384d" stroke-width="1.3"/><rect x="682" y="650" width="16" height="30" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="575" y="671" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">R10 10k B-E</text><line x1="690" y1="680" x2="690" y2="685" stroke="#23384d" stroke-width="1.3"/><line x1="690" y1="685" x2="770" y2="685" stroke="#23384d" stroke-width="1.3"/><text x="850" y="565" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">PA5 HIGH = fire</text><text x="850" y="589" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">PA5 LOW = LED off</text><text x="850" y="613" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Reset pulldown keeps off.</text><text x="850" y="637" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">LED current ~18 mA.</text><text x="45" y="452" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">U2 output pins 4/6 connect ONLY to sheet 1.</text><text x="45" y="476" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">U2 pins 3 and 5 are not connected.</text><text x="45" y="500" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">MOC3052: RANDOM-PHASE / 600 V.</text><text x="45" y="524" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Do not replace with zero-cross MOC306x.</text><text x="45" y="548" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R1+R2=400R limits 253 VAC peak to &lt;0.9 A.</text><text x="45" y="572" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Use 200-500 us LED pulses initially;</text><text x="45" y="596" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">confirm motor current latching/commutation.</text><text x="45" y="620" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C2 100 nF + C3 10 uF: +5V_ISO to GND_LV,</text><text x="45" y="644" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">close to Q2 / U2 LED supply.</text><text x="45" y="668" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Signal polarity differs from old F407 firmware.</text><line x1="35" y1="745" x2="1085" y2="745" stroke="#23384d" stroke-width="1.3"/><text x="35" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Rev A | 02 Oct 2026 | Engineering design: unbuilt, untested; release checks required before mains use.</text><text x="1020" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">2 / 5</text></svg>