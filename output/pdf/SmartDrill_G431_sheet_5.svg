<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect width="100%" height="100%" fill="white"/><text x="35" y="40" fill="#23384d" font-family="Arial,sans-serif" font-size="20" font-weight="700">SMARTDRILL / STM32G431CBU6</text><text x="35" y="65" fill="#23384d" font-family="Arial,sans-serif" font-size="16" font-weight="700">5. BOM, design limits and release checks</text><text x="35" y="88" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Complete signal/power connectivity is specified on sheets 1-4; final PCB footprints and mains protection require validation.</text><line x1="35" y1="104" x2="1085" y2="104" stroke="#23384d" stroke-width="1.3"/><text x="40" y="140" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">Q1</text><text x="155" y="140" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">BTA24-800CWRG, insulated TO-220, 800 V / 25 A</text><text x="560" y="140" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Verify pins; heatsink calculation + full-load temperature test</text><text x="40" y="167" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">U1 / U2</text><text x="155" y="167" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">H11AA1 / MOC3052M, DIP-6</text><text x="560" y="167" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Maintain mains-to-LV barrier; U2 is random phase</text><text x="40" y="194" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">Q2 / U3</text><text x="155" y="194" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">2N3904 / SN74LVC1G17DBVR</text><text x="560" y="194" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Verify B/C/E footprint; U3 requires the specified LVC family</text><text x="40" y="221" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">Q3 / Q4</text><text x="155" y="221" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">2 x BSS138</text><text x="560" y="221" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">I2C bidirectional translator; gate at 3V3</text><text x="40" y="248" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R1 / R2 / R3</text><text x="155" y="248" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">200R 1 W x2 / 330R 0.5 W</text><text x="560" y="248" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Gate limiting: pulse-rated / flameproof resistors</text><text x="40" y="275" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R4 / C1</text><text x="155" y="275" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">100R 2 W / 47 nF X2 305 VAC</text><text x="560" y="275" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Series snubber; tune after inductive-load measurements</text><text x="40" y="302" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R5 / R6</text><text x="155" y="302" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">15k 2 W x2, flameproof, HV-rated</text><text x="560" y="302" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Zero-cross input; thermal clearance around resistors</text><text x="40" y="329" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R7 / R8 / R9 / R10</text><text x="155" y="329" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">10k / 180R 0.5 W / 1k / 10k</text><text x="560" y="329" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">ZC pullup / opto LED / Q2 base / Q2 pulldown</text><text x="40" y="356" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R11 / R12 / R13</text><text x="155" y="356" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">1k / 10k / 1k</text><text x="560" y="356" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Hall series / Hall pullup / ADC series</text><text x="40" y="383" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">R14..R19 / RV2</text><text x="155" y="383" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">10k x2; 4.7k x4 / 10k linear pot</text><text x="560" y="383" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Buttons / I2C / speed setting</text><text x="40" y="410" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">C2..C14</text><text x="155" y="410" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">100 nF x8; 10 uF x3; 47 uF x1; 100 pF x1</text><text x="560" y="410" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Electrolytics &gt;=10 V; C11/C12 are button filters</text><text x="40" y="437" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">RV1 / PS1</text><text x="155" y="437" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">275 VAC MOV / certified isolated 5 V 1 A PSU</text><text x="560" y="437" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">MOV thermal protection required; coordinate surge/fuse ratings</text><text x="40" y="464" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="700">F1 / K0 / HS1</text><text x="155" y="464" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Motor fuse / two-pole cutoff / heatsink</text><text x="560" y="464" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Validate fuse; HS1 &lt;=2 C/W initial target, thermal test required</text><line x1="35" y1="501" x2="1085" y2="501" stroke="#23384d" stroke-width="1.3"/><text x="40" y="530" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">RELEASE CHECKS: no mains bench test until protective earth, insulation, fuse and enclosure have been reviewed.</text><text x="40" y="551" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Target &gt;=8 mm separation between mains and LV copper; final creepage/clearance depends on applicable standard,</text><text x="40" y="572" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">pollution, overvoltage category and materials. This target is not a compliance certification. No copper under barrier.</text><text x="40" y="593" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Gate timing: ZC edges are not exact zero. Calibrate pulse-window timing; inhibit pulses on ZC loss or implausible period.</text><text x="40" y="614" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Power-up stopped; explicit START required. STOP cancels timers. Watchdog/reset must leave PA5 LOW.</text><text x="40" y="635" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Hall loss/stall/overspeed must stop firing; tune startup grace and threshold for actual spindle speed and magnet count.</text><text x="40" y="656" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Retain independent motor overload/thermal protection. No current-measurement channel is included in this revision.</text><text x="40" y="677" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Triac may fail short; K0 must interrupt motor power independently. Preserve magnetic-base interlocks.</text><text x="40" y="698" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Use differential/isolated mains-rated measurement equipment: never attach an ordinary scope ground clip to mains.</text><line x1="35" y1="745" x2="1085" y2="745" stroke="#23384d" stroke-width="1.3"/><text x="35" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Rev A | 02 Oct 2026 | Engineering design: unbuilt, untested; release checks required before mains use.</text><text x="1020" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">5 / 5</text></svg>