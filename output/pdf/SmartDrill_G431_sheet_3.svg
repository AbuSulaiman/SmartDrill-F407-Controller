<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect width="100%" height="100%" fill="white"/><text x="35" y="40" fill="#23384d" font-family="Arial,sans-serif" font-size="20" font-weight="700">SMARTDRILL / STM32G431CBU6</text><text x="35" y="65" fill="#23384d" font-family="Arial,sans-serif" font-size="16" font-weight="700">3. G431, speed sensor, speed knob and controls</text><text x="35" y="88" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">All wiring on this sheet is isolated low-voltage wiring. GND_LV is common; no direct mains connection.</text><line x1="35" y1="104" x2="1085" y2="104" stroke="#23384d" stroke-width="1.3"/><rect x="40" y="130" width="390" height="180" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="50" y="153" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">PS1 isolated 5 VDC / 1 A + existing G431 board</text><text x="55" y="180" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">+5V_ISO -&gt; board USB VBUS using a power-only cable.</text><text x="55" y="199" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">GND_LV -&gt; board USB ground and GND header.</text><text x="55" y="218" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Board 3V3 -&gt; logic rail (use existing regulator).</text><text x="55" y="237" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Do not feed +5V to the 3V3 pin.</text><text x="55" y="256" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">No simultaneous PC USB supply without power OR-ing.</text><text x="55" y="275" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C4: 100 nF; C5: 47 uF across local +5V/GND.</text><text x="55" y="294" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">SWD: PA13=DIO, PA14=CLK, GND, NRST, 3V3 reference.</text><rect x="470" y="130" width="610" height="180" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="480" y="153" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Hall module -&gt; 3.3 V logic buffer</text><text x="485" y="176" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">J3: VCC=+5V_ISO, GND=GND_LV, OUT=HALL_5V.</text><text x="485" y="195" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">HALL_5V -&gt; R11 1k -&gt; U3.A; R12 10k: HALL_5V to +5V.</text><text x="485" y="214" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C6 100 pF: U3.A to GND (local interference filter).</text><text x="485" y="233" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">U3 SN74LVC1G17DBVR: pin 1 NC, 2 A, 3 GND, 4 Y, 5 VCC.</text><text x="485" y="252" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">U3.VCC=3V3; U3.Y -&gt; PA3 / EXTI3; C7 100 nF at U3 supply.</text><text x="485" y="271" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Use ONLY this 5 V-tolerant LVC part, not 74HC at 3.3 V.</text><text x="485" y="290" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C8 100 nF + C9 10 uF at sensor connector.</text><text x="45" y="346" fill="#23384d" font-family="Arial,sans-serif" font-size="13" font-weight="700">Speed knob RV2: 10k linear</text><text x="45" y="377" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">3V3</text><line x1="95" y1="373" x2="125" y2="373" stroke="#23384d" stroke-width="1.3"/><rect x="125" y="355" width="105" height="38" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="135" y="378" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">RV2</text><line x1="230" y1="373" x2="270" y2="373" stroke="#23384d" stroke-width="1.3"/><text x="275" y="377" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">GND_LV</text><line x1="175" y1="393" x2="175" y2="435" stroke="#23384d" stroke-width="1.3"/><line x1="175" y1="435" x2="187" y2="435" stroke="#23384d" stroke-width="1.3"/><rect x="187" y="427" width="86" height="16" fill="none" stroke="#23384d" stroke-width="1.3"/><line x1="273" y1="435" x2="285" y2="435" stroke="#23384d" stroke-width="1.3"/><text x="180" y="418" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R13 1k</text><line x1="285" y1="435" x2="410" y2="435" stroke="#23384d" stroke-width="1.3"/><text x="330" y="423" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">PA1 / ADC1_IN2</text><circle cx="310" cy="435" r="2.5" fill="#23384d"/><line x1="310" y1="435" x2="310" y2="460" stroke="#23384d" stroke-width="1.3"/><text x="320" y="463" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C10 100 nF to GND</text><text x="45" y="489" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Knob voltage range: 0..3V3. Calibrate allowed spindle RPM range.</text><rect x="470" y="335" width="610" height="166" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="480" y="358" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Buttons (software commands, not emergency isolation)</text><text x="485" y="380" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">SW1 START: PB0 -&gt; normally-open contact -&gt; GND_LV.</text><text x="485" y="400" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">SW2 STOP:  PB1 -&gt; normally-open contact -&gt; GND_LV.</text><text x="485" y="420" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">R14 / R15: 10k from PB0 / PB1 to 3V3 respectively.</text><text x="485" y="440" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">C11 / C12: 100 nF from PB0 / PB1 to GND respectively.</text><text x="485" y="460" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Buttons are active LOW. Debounce in firmware.</text><text x="485" y="480" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">K0 on sheet 1 remains the independent hardware motor cutoff.</text><rect x="40" y="525" width="1040" height="183" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="50" y="548" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Pin assignment and firmware requirements</text><text x="55" y="570" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">PA0: zero-cross EXTI both edges. PA3: Hall EXTI selected edge. PA1: ADC speed request.</text><text x="55" y="590" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">PA5: GPIO output LOW at reset / initialization; HIGH-only timed fire pulses. PB0/PB1: button inputs.</text><text x="55" y="610" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">PA15: I2C1_SCL; PB7: I2C1_SDA (AF4, open drain). PA13/PA14 remain SWD.</text><text x="55" y="630" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">TIM3: internal 1 MHz scheduling timer, no external channel needed. IWDG enabled.</text><text x="55" y="650" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Do not reuse PC6 or PB8 until their board connections/leakage are resolved.</text><text x="55" y="670" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Hall magnet must be mechanically retained. RPM = 60*f/pulses_per_revolution.</text><text x="55" y="690" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">A motor-shaft sensor needs the gearbox ratio to compute spindle RPM; spindle-mounted sensor does not.</text><line x1="35" y1="745" x2="1085" y2="745" stroke="#23384d" stroke-width="1.3"/><text x="35" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Rev A | 02 Oct 2026 | Engineering design: unbuilt, untested; release checks required before mains use.</text><text x="1020" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">3 / 5</text></svg>