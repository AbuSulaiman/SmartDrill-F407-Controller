<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790"><rect width="100%" height="100%" fill="white"/><text x="35" y="40" fill="#23384d" font-family="Arial,sans-serif" font-size="20" font-weight="700">SMARTDRILL / STM32G431CBU6</text><text x="35" y="65" fill="#23384d" font-family="Arial,sans-serif" font-size="16" font-weight="700">4. LCD1602 I2C interface and connection schedule</text><text x="35" y="88" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">Existing 5 V LCD + PCF8574 backpack retained. Use a bidirectional level translator; never pull MCU I2C to 5 V.</text><line x1="35" y1="104" x2="1085" y2="104" stroke="#23384d" stroke-width="1.3"/><text x="45" y="254" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">PA15 / SCL_LV</text><line x1="180" y1="250" x2="400" y2="250" stroke="#23384d" stroke-width="1.3"/><rect x="400" y="225" width="220" height="55" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="410" y="248" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Q3 BSS138</text><text x="410" y="268" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">S=LV / D=HV / G=3V3</text><line x1="620" y1="250" x2="880" y2="250" stroke="#23384d" stroke-width="1.3"/><text x="890" y="254" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">J4.SCL / SCL_HV</text><circle cx="250" cy="250" r="2.5" fill="#23384d"/><line x1="250" y1="250" x2="250" y2="192" stroke="#23384d" stroke-width="1.3"/><rect x="242" y="162" width="16" height="30" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="180" y="147" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">3V3</text><text x="265" y="182" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">4.7k</text><circle cx="770" cy="250" r="2.5" fill="#23384d"/><line x1="770" y1="250" x2="770" y2="192" stroke="#23384d" stroke-width="1.3"/><rect x="762" y="162" width="16" height="30" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="700" y="147" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">+5V_ISO</text><text x="785" y="182" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">4.7k</text><text x="405" y="299" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Gate tied to 3V3; body diode orientation must follow S/D.</text><text x="45" y="444" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">PB7 / SDA_LV</text><line x1="180" y1="440" x2="400" y2="440" stroke="#23384d" stroke-width="1.3"/><rect x="400" y="415" width="220" height="55" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="410" y="438" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="700">Q4 BSS138</text><text x="410" y="458" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">S=LV / D=HV / G=3V3</text><line x1="620" y1="440" x2="880" y2="440" stroke="#23384d" stroke-width="1.3"/><text x="890" y="444" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">J4.SDA / SDA_HV</text><circle cx="250" cy="440" r="2.5" fill="#23384d"/><line x1="250" y1="440" x2="250" y2="382" stroke="#23384d" stroke-width="1.3"/><rect x="242" y="352" width="16" height="30" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="180" y="337" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">3V3</text><text x="265" y="372" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">4.7k</text><circle cx="770" cy="440" r="2.5" fill="#23384d"/><line x1="770" y1="440" x2="770" y2="382" stroke="#23384d" stroke-width="1.3"/><rect x="762" y="352" width="16" height="30" fill="none" stroke="#23384d" stroke-width="1.3"/><text x="700" y="337" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">+5V_ISO</text><text x="785" y="372" fill="#23384d" font-family="Arial,sans-serif" font-size="11" font-weight="400">4.7k</text><text x="405" y="489" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Gate tied to 3V3; body diode orientation must follow S/D.</text><text x="45" y="540" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">J4 LCD connector: GND=GND_LV, VCC=+5V_ISO, SCL=SCL_HV, SDA=SDA_HV.</text><text x="45" y="566" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">R16/R17: 4.7k LV pullups. R18/R19: 4.7k HV pullups.</text><text x="45" y="592" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">If the backpack already has HV pullups, omit R18/R19 after measuring the existing resistance.</text><text x="45" y="618" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">BSS138 SOT-23 common pinout: 1=G, 2=S, 3=D; verify chosen manufacturer before footprint assignment.</text><text x="45" y="644" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">C13: 100 nF and C14: 10 uF at J4 +5V/GND. Use short I2C wiring and start at 100 kHz.</text><text x="45" y="670" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">Discover actual PCF8574/PCF8574A I2C address and backpack LCD pin mapping in firmware.</text><text x="45" y="696" fill="#23384d" font-family="Arial,sans-serif" font-size="12" font-weight="400">J5 optional SWD: 3V3 reference, GND, PA13/DIO, PA14/CLK, NRST; avoid duplicate target power.</text><line x1="35" y1="745" x2="1085" y2="745" stroke="#23384d" stroke-width="1.3"/><text x="35" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">Rev A | 02 Oct 2026 | Engineering design: unbuilt, untested; release checks required before mains use.</text><text x="1020" y="769" fill="#23384d" font-family="Arial,sans-serif" font-size="10" font-weight="400">4 / 5</text></svg>